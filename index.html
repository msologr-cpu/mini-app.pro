<!DOCTYPE html>
<html lang="ru" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="home.meta.title" data-i18n-mode="text"></title>
    <meta name="description" content="" data-i18n="home.meta.description" data-i18n-attr="content" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" data-i18n="home.meta.ogTitle" data-i18n-attr="content" />
    <meta
      property="og:description"
      content=""
      data-i18n="home.meta.ogDescription"
      data-i18n-attr="content"
    />
    <meta property="og:url" content="https://mini-app.pro/" />
    <meta property="og:image" content="https://mini-app.pro/assets/images/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" data-i18n="home.meta.twitterTitle" data-i18n-attr="content" />
    <meta
      name="twitter:description"
      content=""
      data-i18n="home.meta.twitterDescription"
      data-i18n-attr="content"
    />
    <meta name="twitter:image" content="https://mini-app.pro/assets/images/og-cover.svg" />
    <link rel="alternate" hreflang="ru" href="https://mini-app.pro/" />
    <link rel="alternate" hreflang="en" href="https://mini-app.pro/en/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header" id="top">
        <div class="container header-inner">
          <a class="brand" href="#hero" aria-label="mini-app.pro">
            <span class="brand-mark" aria-hidden="true">μ</span>
            <span class="brand-text">
              <span class="brand-title" data-i18n="home.header.brandTitle" data-i18n-mode="text"></span>
              <span class="brand-tagline" data-i18n="home.header.brandTagline" data-i18n-mode="text"></span>
            </span>
          </a>
          <nav
            class="desktop-nav"
            aria-label="Главное меню"
            data-i18n-attrs="aria-label:home.header.navLabel"
          >
            <a href="#mini-app" data-i18n="home.header.links.miniApp" data-i18n-mode="text"></a>
            <a href="#benefits" data-i18n="home.header.links.benefits" data-i18n-mode="text"></a>
            <a href="#workflow" data-i18n="home.header.links.workflow" data-i18n-mode="text"></a>
            <a href="#cases" data-i18n="home.header.links.cases" data-i18n-mode="text"></a>
            <a href="#why-us" data-i18n="home.header.links.whyUs" data-i18n-mode="text"></a>
            <a href="/blog/" data-i18n="home.header.links.blog" data-i18n-mode="text"></a>
          </nav>
          <div class="header-controls">
            <div class="language-switcher" data-language-switcher>
              <button
                type="button"
                class="language-switcher__toggle"
                data-language-toggle
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="language-switcher__flag" data-language-flag aria-hidden="true">🌐</span>
                <span class="language-switcher__code" data-language-code>--</span>
              </button>
              <div
                class="language-switcher__dropdown"
                role="listbox"
                data-language-options
                hidden
              ></div>
            </div>
            <a
              class="cta-button"
              href="https://unitee.space"
              target="_blank"
              rel="noopener"
              data-i18n="home.header.cta"
              data-i18n-mode="text"
            ></a>
          </div>
        </div>
      </header>
      <main>
        <section class="hero" id="hero">
          <div class="gradient-orbit" aria-hidden="true"></div>
          <div class="container hero-content">
            <div class="hero-badge" data-i18n="home.hero.badge" data-i18n-mode="text"></div>
            <h1 data-i18n="home.hero.title" data-i18n-mode="text"></h1>
            <p data-i18n="home.hero.description"></p>
            <div class="hero-actions">
              <a
                class="cta-button primary"
                href="https://unitee.space"
                target="_blank"
                rel="noopener"
                data-i18n="home.hero.primaryCta"
                data-i18n-mode="text"
              ></a>
              <a class="ghost-link" href="#mini-app" data-i18n="home.hero.secondaryLink" data-i18n-mode="text"></a>
            </div>
          </div>
        </section>

        <section class="section intro" id="mini-app">
          <div class="container section-inner">
            <header class="section-header">
              <h2 data-i18n="home.intro.title" data-i18n-mode="text"></h2>
              <p data-i18n="home.intro.description"></p>
            </header>
            <div class="pill-grid" role="list">
              <span class="pill" role="listitem" data-i18n="home.intro.pills.fast" data-i18n-mode="text"></span>
              <span class="pill" role="listitem" data-i18n="home.intro.pills.secure" data-i18n-mode="text"></span>
              <span class="pill" role="listitem" data-i18n="home.intro.pills.nocode" data-i18n-mode="text"></span>
              <span class="pill" role="listitem" data-i18n="home.intro.pills.telegram" data-i18n-mode="text"></span>
            </div>
          </div>
        </section>

        <section class="section benefits" id="benefits">
          <div class="container section-inner">
            <header class="section-header">
              <h2 data-i18n="home.benefits.title" data-i18n-mode="text"></h2>
            </header>
            <div class="card-grid">
              <article class="benefit-card">
                <div class="icon" aria-hidden="true">🚫</div>
                <h3 data-i18n="home.benefits.cards.noStore.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.benefits.cards.noStore.description"></p>
              </article>
              <article class="benefit-card">
                <div class="icon" aria-hidden="true">👩‍💻</div>
                <h3 data-i18n="home.benefits.cards.noDevelopers.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.benefits.cards.noDevelopers.description"></p>
              </article>
              <article class="benefit-card">
                <div class="icon" aria-hidden="true">📇</div>
                <h3 data-i18n="home.benefits.cards.crm.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.benefits.cards.crm.description"></p>
              </article>
              <article class="benefit-card">
                <div class="icon" aria-hidden="true">📊</div>
                <h3 data-i18n="home.benefits.cards.analytics.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.benefits.cards.analytics.description"></p>
              </article>
            </div>
          </div>
        </section>

        <section class="section workflow" id="workflow">
          <div class="container section-inner">
            <header class="section-header">
              <h2 data-i18n="home.workflow.title" data-i18n-mode="text"></h2>
              <p data-i18n="home.workflow.description"></p>
            </header>
            <ol class="workflow-steps">
              <li>
                <div class="step-icon" aria-hidden="true">1</div>
                <h3 data-i18n="home.workflow.steps.one.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.workflow.steps.one.description"></p>
              </li>
              <li>
                <div class="step-icon" aria-hidden="true">2</div>
                <h3 data-i18n="home.workflow.steps.two.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.workflow.steps.two.description"></p>
              </li>
              <li>
                <div class="step-icon" aria-hidden="true">3</div>
                <h3 data-i18n="home.workflow.steps.three.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.workflow.steps.three.description"></p>
              </li>
              <li>
                <div class="step-icon" aria-hidden="true">4</div>
                <h3 data-i18n="home.workflow.steps.four.title" data-i18n-mode="text"></h3>
                <p data-i18n="home.workflow.steps.four.description"></p>
              </li>
            </ol>
          </div>
        </section>

        <section class="section cases" id="cases">
          <div class="container section-inner">
            <header class="section-header">
              <h2 data-i18n="home.cases.title" data-i18n-mode="text"></h2>
              <p data-i18n="home.cases.description"></p>
            </header>
            <div class="case-grid">
              <article class="case-card">
                <img
                  src="assets/images/case-ecommerce.svg"
                  alt=""
                  data-i18n="home.cases.cards.ecommerce.alt"
                  data-i18n-attr="alt"
                />
                <div class="case-body">
                  <h3 data-i18n="home.cases.cards.ecommerce.title" data-i18n-mode="text"></h3>
                  <p data-i18n="home.cases.cards.ecommerce.description"></p>
                  <a
                    class="ghost-link"
                    href="https://unitee.space"
                    target="_blank"
                    rel="noopener"
                    data-i18n="home.cases.cards.ecommerce.link"
                    data-i18n-mode="text"
                  ></a>
                </div>
              </article>
              <article class="case-card">
                <img
                  src="assets/images/case-education.svg"
                  alt=""
                  data-i18n="home.cases.cards.education.alt"
                  data-i18n-attr="alt"
                />
                <div class="case-body">
                  <h3 data-i18n="home.cases.cards.education.title" data-i18n-mode="text"></h3>
                  <p data-i18n="home.cases.cards.education.description"></p>
                  <a
                    class="ghost-link"
                    href="https://unitee.space"
                    target="_blank"
                    rel="noopener"
                    data-i18n="home.cases.cards.education.link"
                    data-i18n-mode="text"
                  ></a>
                </div>
              </article>
              <article class="case-card">
                <img
                  src="assets/images/case-community.svg"
                  alt=""
                  data-i18n="home.cases.cards.community.alt"
                  data-i18n-attr="alt"
                />
                <div class="case-body">
                  <h3 data-i18n="home.cases.cards.community.title" data-i18n-mode="text"></h3>
                  <p data-i18n="home.cases.cards.community.description"></p>
                  <a
                    class="ghost-link"
                    href="https://unitee.space"
                    target="_blank"
                    rel="noopener"
                    data-i18n="home.cases.cards.community.link"
                    data-i18n-mode="text"
                  ></a>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="section why-us" id="why-us">
          <div class="container section-inner">
            <header class="section-header">
              <h2 data-i18n="home.whyUs.title" data-i18n-mode="text"></h2>
              <p data-i18n="home.whyUs.description"></p>
            </header>
            <div class="stats-strip">
              <div class="stat">
                <span class="stat-value" data-i18n="home.whyUs.stats.launched.value" data-i18n-mode="text"></span>
                <span class="stat-label" data-i18n="home.whyUs.stats.launched.label" data-i18n-mode="text"></span>
              </div>
              <div class="stat">
                <span class="stat-value" data-i18n="home.whyUs.stats.users.value" data-i18n-mode="text"></span>
                <span class="stat-label" data-i18n="home.whyUs.stats.users.label" data-i18n-mode="text"></span>
              </div>
              <div class="stat">
                <span class="stat-value" data-i18n="home.whyUs.stats.support.value" data-i18n-mode="text"></span>
                <span class="stat-label" data-i18n="home.whyUs.stats.support.label" data-i18n-mode="text"></span>
              </div>
            </div>
            <div class="partner-logos" aria-label="Партнеры" data-i18n-attrs="aria-label:home.whyUs.partnersLabel">
              <span data-i18n="home.whyUs.partners.evera" data-i18n-mode="text"></span>
              <span data-i18n="home.whyUs.partners.soloLabs" data-i18n-mode="text"></span>
              <span data-i18n="home.whyUs.partners.unitee" data-i18n-mode="text"></span>
              <span data-i18n="home.whyUs.partners.miniApp" data-i18n-mode="text"></span>
            </div>
          </div>
        </section>

        <section class="section blog-preview" id="blog">
          <div class="container section-inner">
            <header class="section-header">
              <h2 data-i18n="home.blogPreview.title" data-i18n-mode="text"></h2>
              <p data-i18n="home.blogPreview.description"></p>
            </header>
            <div class="blog-grid">
              <article class="blog-card">
                <figure>
                  <img
                    src="assets/images/blog-miniapp-preview.svg"
                    alt=""
                    loading="lazy"
                    data-i18n="home.blogPreview.card.alt"
                    data-i18n-attr="alt"
                  />
                </figure>
                <div class="blog-card-body">
                  <h3 data-i18n="home.blogPreview.card.title" data-i18n-mode="text"></h3>
                  <p data-i18n="home.blogPreview.card.description"></p>
                  <p class="blog-card-meta" data-i18n="home.blogPreview.card.meta" data-i18n-mode="text"></p>
                  <a class="ghost-link" href="/blog/telegram-mini-apps/" data-i18n="home.blogPreview.card.link" data-i18n-mode="text"></a>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="section cta" id="cta">
          <div class="container cta-inner">
            <h2 data-i18n="home.cta.title" data-i18n-mode="text"></h2>
            <p data-i18n="home.cta.description"></p>
            <a
              class="cta-button primary"
              href="https://unitee.space"
              target="_blank"
              rel="noopener"
              data-i18n="home.cta.button"
              data-i18n-mode="text"
            ></a>
          </div>
        </section>
      </main>

      <footer class="site-footer" id="footer">
        <div class="container footer-inner">
          <div class="footer-brand">
            <span class="brand-mark" aria-hidden="true">μ</span>
            <div>
              <span class="brand-title" data-i18n="home.footer.brandTitle" data-i18n-mode="text"></span>
              <span class="brand-tagline" data-i18n="home.footer.brandTagline" data-i18n-mode="text"></span>
            </div>
          </div>
          <nav class="footer-links" aria-label="Ссылки" data-i18n-attrs="aria-label:home.footer.linksLabel">
            <a href="https://unitee.space" target="_blank" rel="noopener" data-i18n="home.footer.links.unitee" data-i18n-mode="text"></a>
            <a href="https://t.me/sololabschannel" target="_blank" rel="noopener" data-i18n="home.footer.links.soloLabs" data-i18n-mode="text"></a>
            <a href="https://evera.world" target="_blank" rel="noopener" data-i18n="home.footer.links.evera" data-i18n-mode="text"></a>
            <a href="https://t.me/unitee_space_bot" target="_blank" rel="noopener" data-i18n="home.footer.links.bot" data-i18n-mode="text"></a>
            <a href="/blog/" data-i18n="home.footer.links.blog" data-i18n-mode="text"></a>
          </nav>
        </div>
      </footer>

      <nav
        class="mobile-bottom-nav"
        aria-label="Навигация Mini App"
        data-i18n-attrs="aria-label:home.mobileNav.label"
      >
        <a href="#hero" class="mobile-nav-link">
          <span class="nav-icon" aria-hidden="true">🏠</span>
          <span data-i18n="home.mobileNav.home" data-i18n-mode="text"></span>
        </a>
        <a href="#mini-app" class="mobile-nav-link">
          <span class="nav-icon" aria-hidden="true">ℹ️</span>
          <span data-i18n="home.mobileNav.miniApp" data-i18n-mode="text"></span>
        </a>
        <a href="#cases" class="mobile-nav-link">
          <span class="nav-icon" aria-hidden="true">⭐</span>
          <span data-i18n="home.mobileNav.cases" data-i18n-mode="text"></span>
        </a>
        <a href="#blog" class="mobile-nav-link">
          <span class="nav-icon" aria-hidden="true">📰</span>
          <span data-i18n="home.mobileNav.blog" data-i18n-mode="text"></span>
        </a>
        <a href="#cta" class="mobile-nav-link">
          <span class="nav-icon" aria-hidden="true">🚀</span>
          <span data-i18n="home.mobileNav.start" data-i18n-mode="text"></span>
        </a>
      </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.10.1/dist/umd/i18next.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@2.5.1/dist/umd/i18nextHttpBackend.min.js" defer></script>
    <script src="/assets/js/i18n.js" defer></script>
  </body>
</html>
