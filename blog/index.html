<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="blogIndex.meta.title" data-i18n-mode="text"></title>
    <meta
      name="description"
      content=""
      data-i18n="blogIndex.meta.description"
      data-i18n-attr="content"
    />
    <link rel="canonical" href="https://mini-app.pro/blog/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #222222;
        line-height: 1.7;
      }

      a {
        color: #3a7afe;
        text-decoration: none;
      }

      a:hover,
      a:focus {
        text-decoration: underline;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px 104px;
      }

      h1 {
        font-size: 2.4rem;
        font-weight: 600;
        color: #111111;
        margin-bottom: 24px;
      }

      p {
        margin: 0 0 24px;
      }

      .intro {
        margin-bottom: 64px;
        color: #555b67;
      }

      .post-card {
        display: block;
        padding: 32px;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #e4e7ee;
        box-shadow: 0 16px 40px rgba(58, 122, 254, 0.12);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .post-card:hover,
      .post-card:focus {
        transform: translateY(-4px);
        box-shadow: 0 20px 52px rgba(58, 122, 254, 0.16);
        text-decoration: none;
      }

      .post-card h2 {
        font-size: 1.8rem;
        font-weight: 600;
        margin: 0 0 12px;
        color: #111111;
      }

      .post-card p {
        margin: 0 0 16px;
        color: #555b67;
      }

      .post-meta {
        font-size: 0.95rem;
        color: #6f7582;
      }

      @media (max-width: 720px) {
        main {
          padding: 40px 16px 88px;
        }

        .post-card {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="blogIndex.heading"></h1>
      <p class="intro" data-i18n="blogIndex.intro"></p>
      <a class="post-card" href="/blog/telegram-mini-apps/">
        <h2 data-i18n="blogIndex.card.title" data-i18n-mode="text"></h2>
        <p data-i18n="blogIndex.card.description"></p>
        <div class="post-meta" data-i18n="blogIndex.card.meta" data-i18n-mode="text"></div>
      </a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.10.1/dist/umd/i18next.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@2.5.1/dist/umd/i18nextHttpBackend.min.js" defer></script>
    <script src="/assets/js/i18n.js" defer></script>
  </body>
</html>
