<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="homeEn.meta.title" data-i18n-mode="text"></title>
    <meta
      name="description"
      content=""
      data-i18n="homeEn.meta.description"
      data-i18n-attr="content"
    />
    <link rel="alternate" hreflang="en" href="https://mini-app.pro/en/" />
    <link rel="alternate" hreflang="ru" href="https://mini-app.pro/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="antialiased">
    <div class="relative flex min-h-screen flex-col">
      <header class="site-header sticky top-0 z-40">
        <div class="site-header-inner">
          <a href="#hero" class="site-brand" aria-label="mini-app.pro">
            <span class="brand-mark" aria-hidden="true">μ</span>
            <span class="brand-text">
              <strong data-i18n="homeEn.header.brandTitle" data-i18n-mode="text"></strong>
              <span data-i18n="homeEn.header.brandTagline" data-i18n-mode="text"></span>
            </span>
          </a>
          <nav
            class="desktop-nav"
            aria-label="Primary menu"
            data-i18n-attrs="aria-label:homeEn.header.navLabel"
          >
            <a href="#solutions" data-i18n="homeEn.header.links.solutions" data-i18n-mode="text"></a>
            <a href="#process" data-i18n="homeEn.header.links.process" data-i18n-mode="text"></a>
            <a href="#cases" data-i18n="homeEn.header.links.cases" data-i18n-mode="text"></a>
            <a href="#faq" data-i18n="homeEn.header.links.faq" data-i18n-mode="text"></a>
            <a href="#contact" data-i18n="homeEn.header.links.contact" data-i18n-mode="text"></a>
            <a href="/blog/" data-i18n="homeEn.header.links.blog" data-i18n-mode="text"></a>
          </nav>
          <div class="header-controls">
            <div class="language-switcher" data-language-switcher>
              <button
                type="button"
                class="language-switcher__toggle"
                data-language-toggle
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="language-switcher__flag" data-language-flag aria-hidden="true">🌐</span>
                <span class="language-switcher__code" data-language-code>--</span>
              </button>
              <div
                class="language-switcher__dropdown"
                role="listbox"
                data-language-options
                hidden
              ></div>
            </div>
            <button
              type="button"
              class="hamburger"
              aria-label="Open menu"
              aria-expanded="false"
              aria-controls="mobile-menu"
              data-mobile-toggle
              data-i18n="homeEn.header.openMenu"
              data-i18n-attr="aria-label"
            >
              <span class="sr-only" data-i18n="homeEn.header.menuLabel" data-i18n-mode="text"></span>
              <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M4 7h16M4 12h16M10 17h10" />
              </svg>
            </button>
          </div>
        </div>
        <div class="mobile-menu-backdrop" data-mobile-overlay hidden></div>
        <div class="mobile-menu-panel" id="mobile-menu" data-mobile-menu hidden>
          <div class="mobile-menu-header">
            <a href="#hero" class="menu-logo" aria-label="mini-app.pro">
              <span>μ</span>
            </a>
            <button
              type="button"
              class="mobile-close"
              aria-label="Close menu"
              data-mobile-close
              data-i18n="homeEn.header.closeMenu"
              data-i18n-attr="aria-label"
            >
              ✕
            </button>
          </div>
          <div class="mobile-menu-body">
            <h2 class="mobile-menu-title" data-i18n="homeEn.header.mobileTitle" data-i18n-mode="text"></h2>
            <p class="mobile-menu-text" data-i18n="homeEn.header.mobileText"></p>
            <nav class="mobile-nav" aria-label="Sections" data-i18n-attrs="aria-label:homeEn.header.mobileSections">
              <a href="#solutions" class="menu-link" data-i18n="homeEn.header.links.solutions" data-i18n-mode="text"></a>
              <a href="#process" class="menu-link" data-i18n="homeEn.header.links.process" data-i18n-mode="text"></a>
              <a href="#cases" class="menu-link" data-i18n="homeEn.header.links.cases" data-i18n-mode="text"></a>
              <a href="#faq" class="menu-link" data-i18n="homeEn.header.links.faq" data-i18n-mode="text"></a>
              <a href="#contact" class="menu-link" data-i18n="homeEn.header.links.contact" data-i18n-mode="text"></a>
              <a href="/blog/" class="menu-link" data-i18n="homeEn.header.links.blog" data-i18n-mode="text"></a>
            </nav>
            <a href="https://unitee.space" target="_blank" rel="noopener" class="menu-link" data-i18n="homeEn.header.uniteeLink" data-i18n-mode="text"></a>
            <a href="mailto:hello@unitee.space" class="menu-link" data-i18n="homeEn.header.email" data-i18n-mode="text"></a>
          </div>
          <div class="mobile-menu-footer">
            <a
              href="https://unitee.space"
              target="_blank"
              rel="noopener"
              class="cta-button w-full text-center"
              data-i18n="homeEn.header.book"
              data-i18n-mode="text"
            ></a>
          </div>
        </div>
      </header>
      <main class="flex-1">
        <section id="hero" class="hero-section" data-topic="overview">
          <div class="hero-overlay" aria-hidden="true"></div>
          <div class="relative z-10 mx-auto flex w-full max-w-3xl flex-col items-center text-center">
            <span class="hero-mark">μ</span>
            <h1 class="hero-title" data-i18n="homeEn.hero.title"></h1>
            <p class="hero-subtitle" data-i18n="homeEn.hero.description"></p>
            <div class="hero-actions">
              <a href="https://unitee.space" target="_blank" rel="noopener" class="cta-button" data-i18n="homeEn.hero.primaryCta" data-i18n-mode="text"></a>
              <a href="mailto:hello@unitee.space" class="secondary-link" data-i18n="homeEn.hero.secondary" data-i18n-mode="text"></a>
            </div>
          </div>
        </section>
        <section id="solutions" class="content-section" data-topic="benefits">
          <div class="section-inner">
            <div class="section-header">
              <h2 class="section-title" data-i18n="homeEn.solutions.title" data-i18n-mode="text"></h2>
              <p class="section-subtitle" data-i18n="homeEn.solutions.description"></p>
            </div>
            <div class="feature-grid">
              <article class="feature-card">
                <h3 data-i18n="homeEn.solutions.cards.ux.title" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.solutions.cards.ux.description"></p>
              </article>
              <article class="feature-card">
                <h3 data-i18n="homeEn.solutions.cards.integrations.title" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.solutions.cards.integrations.description"></p>
              </article>
              <article class="feature-card">
                <h3 data-i18n="homeEn.solutions.cards.analytics.title" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.solutions.cards.analytics.description"></p>
              </article>
            </div>
          </div>
        </section>
        <section id="process" class="content-section alt" data-topic="process">
          <div class="section-inner">
            <div class="section-header">
              <h2 class="section-title" data-i18n="homeEn.process.title" data-i18n-mode="text"></h2>
              <p class="section-subtitle" data-i18n="homeEn.process.description"></p>
            </div>
            <ol class="process-timeline">
              <li>
                <span class="process-step">1</span>
                <div>
                  <h3 data-i18n="homeEn.process.steps.one.title" data-i18n-mode="text"></h3>
                  <p data-i18n="homeEn.process.steps.one.description"></p>
                </div>
              </li>
              <li>
                <span class="process-step">2</span>
                <div>
                  <h3 data-i18n="homeEn.process.steps.two.title" data-i18n-mode="text"></h3>
                  <p data-i18n="homeEn.process.steps.two.description"></p>
                </div>
              </li>
              <li>
                <span class="process-step">3</span>
                <div>
                  <h3 data-i18n="homeEn.process.steps.three.title" data-i18n-mode="text"></h3>
                  <p data-i18n="homeEn.process.steps.three.description"></p>
                </div>
              </li>
              <li>
                <span class="process-step">4</span>
                <div>
                  <h3 data-i18n="homeEn.process.steps.four.title" data-i18n-mode="text"></h3>
                  <p data-i18n="homeEn.process.steps.four.description"></p>
                </div>
              </li>
            </ol>
          </div>
        </section>
        <section id="cases" class="content-section" data-topic="cases">
          <div class="section-inner">
            <div class="section-header">
              <h2 class="section-title" data-i18n="homeEn.cases.title" data-i18n-mode="text"></h2>
              <p class="section-subtitle" data-i18n="homeEn.cases.description"></p>
            </div>
            <div class="case-grid">
              <article class="case-card">
                <h3 data-i18n="homeEn.cases.cards.commerce.title" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.cases.cards.commerce.description"></p>
              </article>
              <article class="case-card">
                <h3 data-i18n="homeEn.cases.cards.education.title" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.cases.cards.education.description"></p>
              </article>
              <article class="case-card">
                <h3 data-i18n="homeEn.cases.cards.service.title" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.cases.cards.service.description"></p>
              </article>
            </div>
          </div>
        </section>
        <section id="faq" class="content-section alt" data-topic="faq">
          <div class="section-inner">
            <div class="section-header">
              <h2 class="section-title" data-i18n="homeEn.faq.title" data-i18n-mode="text"></h2>
              <p class="section-subtitle" data-i18n="homeEn.faq.description"></p>
            </div>
            <div class="faq-list">
              <article class="faq-item">
                <h3 data-i18n="homeEn.faq.items.timeline.question" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.faq.items.timeline.answer"></p>
              </article>
              <article class="faq-item">
                <h3 data-i18n="homeEn.faq.items.developers.question" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.faq.items.developers.answer"></p>
              </article>
              <article class="faq-item">
                <h3 data-i18n="homeEn.faq.items.iterate.question" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.faq.items.iterate.answer"></p>
              </article>
              <article class="faq-item">
                <h3 data-i18n="homeEn.faq.items.support.question" data-i18n-mode="text"></h3>
                <p data-i18n="homeEn.faq.items.support.answer"></p>
              </article>
            </div>
          </div>
        </section>
        <section id="contact" class="content-section final" data-topic="contact">
          <div class="section-inner">
            <div class="contact-card">
              <h2 data-i18n="homeEn.contact.title" data-i18n-mode="text"></h2>
              <p data-i18n="homeEn.contact.description"></p>
              <div class="contact-actions">
                <a
                  href="https://unitee.space"
                  target="_blank"
                  rel="noopener"
                  class="cta-button"
                  data-i18n="homeEn.contact.cta"
                  data-i18n-mode="text"
                ></a>
                <a href="mailto:hello@unitee.space" class="secondary-link" data-i18n="homeEn.contact.secondary" data-i18n-mode="text"></a>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../assets/js/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.10.1/dist/umd/i18next.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@2.5.1/dist/umd/i18nextHttpBackend.min.js" defer></script>
    <script src="/assets/js/i18n.js" defer></script>
  </body>
</html>
